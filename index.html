<!doctype html>
<html lang="ko">
<head>
<title>웨딩홀 후기 노트</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 좌측 작성 폼 + 우측 후기 목록 (모바일에서는 한 열). 청첩장 카드 느낌의 종이 질감 대신 차분한 청록 먹색 톤 */
:root {
  --bg: #f1f4f3;
  --surface: #ffffff;
  --fg: #1f2a28;
  --muted: #5d6c69;
  --line: #d5dedb;
  --accent: #8a2f4b;
  --accent-fg: #ffffff;
  --accent-soft: #f3e3e8;
  --star: #c98a1b;
  --good: #2f7d5b;
  --font-display: "Gowun Batang", "Noto Serif KR", serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a19; --surface: #1b2423; --fg: #e6eeec; --muted: #9db0ac; --line: #2f3d3b;
    --accent: #e08aa5; --accent-fg: #2a0f19; --accent-soft: #3a2230; --star: #e5b04d; --good: #6cc29c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a19; --surface: #1b2423; --fg: #e6eeec; --muted: #9db0ac; --line: #2f3d3b;
  --accent: #e08aa5; --accent-fg: #2a0f19; --accent-soft: #3a2230; --star: #e5b04d; --good: #6cc29c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header h1 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 40px); line-height: 1.25; margin: 0 0 8px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; margin-top: 28px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0 0 14px; }
form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 22px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 12px; }
legend { padding: 0; font-weight: 700; font-size: 13px; letter-spacing: .04em; color: var(--accent); margin-bottom: 10px; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .row { grid-template-columns: minmax(0, 1fr); } }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], input[type=month], select, textarea {
  width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; min-width: 0;
}
textarea { resize: vertical; min-height: 140px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rate { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rate span.n { font-size: 14px; }
.stars { display: inline-flex; gap: 2px; }
.stars button { background: none; border: 0; padding: 2px; cursor: pointer; font-size: 24px; line-height: 1; color: var(--line); }
.stars button.on { color: var(--star); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { cursor: pointer; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips span { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: var(--bg); }
.chips input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.chips input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-size: 12px; color: var(--muted); text-align: right; }
.photos { display: flex; flex-wrap: wrap; gap: 8px; }
.photos .ph { width: 76px; height: 76px; border-radius: 6px; background-size: cover; background-position: center; position: relative; border: 1px solid var(--line); }
.photos .ph button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); cursor: pointer; font-size: 13px; line-height: 1; }
.add { width: 76px; height: 76px; border: 1px dashed var(--muted); border-radius: 6px; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; }
.btn { font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; padding: 12px 18px; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.sync { font-size: 12.5px; color: var(--muted); margin: -6px 0 12px; min-height: 1.2em; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); }
.err { color: var(--accent); font-size: 13px; min-height: 1.2em; margin: 0; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.summary .big { font-family: var(--font-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.summary small { color: var(--muted); display: block; }
.list { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.card h3 { font-family: var(--font-display); font-size: 18px; margin: 0 0 2px; overflow-wrap: anywhere; }
.meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.card .overall { color: var(--star); letter-spacing: 1px; margin: 8px 0 4px; font-size: 16px; }
.card .overall b { color: var(--fg); font-size: 14px; letter-spacing: 0; margin-left: 6px; font-variant-numeric: tabular-nums; }
.card p.body { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.scores { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin: 8px 6px 0 0; }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.thumbs img { width: 88px; height: 88px; object-fit: cover; border-radius: 6px; }
.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
.foot button { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; text-decoration: underline; }
.ex { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .card { animation: in .25s ease-out; } @keyframes in { from { opacity: .3; transform: translateY(6px); } } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>다녀온 예식장, 솔직하게 남겨주세요</h1>
    <p>식대, 주차, 동선, 대기 시간까지. 등록한 후기는 이 페이지를 여는 모든 사람에게 바로 보입니다.</p>
  </header>

  <div class="grid">
    <form id="form" novalidate>
      <fieldset>
        <legend>예식장 정보</legend>
        <label class="f">예식장 이름
          <input type="text" id="hall" placeholder="예: 더채플 앳 청담" maxlength="40" autocomplete="off">
        </label>
        <div class="row">
          <label class="f">지역
            <select id="region">
              <option value="">선택</option>
              <option>서울</option><option>경기</option><option>인천</option><option>부산</option><option>대구</option><option>대전</option><option>광주</option><option>울산·세종</option><option>강원</option><option>충청</option><option>전라</option><option>경상</option><option>제주</option>
            </select>
          </label>
          <label class="f">방문 월
            <input type="month" id="visit">
          </label>
        </div>
        <div class="row">
          <label class="f">방문 유형
            <select id="kind">
              <option>예식 당사자</option><option>하객으로 참석</option><option>상담·견학만</option>
            </select>
          </label>
          <label class="f">식대(1인, 만원)
            <input type="number" id="meal" min="0" max="50" step="0.5" placeholder="예: 7.5" inputmode="decimal">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>항목별 평점</legend>
        <div id="rates"></div>
      </fieldset>

      <fieldset>
        <legend>해당되는 항목</legend>
        <div class="chips" id="chips"></div>
      </fieldset>

      <fieldset>
        <legend>후기</legend>
        <label class="f">한 줄 제목
          <input type="text" id="title" placeholder="예: 홀은 예쁜데 주차가 아쉬웠어요" maxlength="50">
        </label>
        <label class="f">자세한 후기
          <textarea id="body" maxlength="1000" placeholder="상담 때 들은 내용과 실제가 달랐던 점, 추가 비용, 식사 맛, 신부대기실 등을 적어주세요."></textarea>
        </label>
        <div class="count"><span id="cnt">0</span> / 1000</div>
      </fieldset>

      <fieldset>
        <legend>사진 (최대 4장)</legend>
        <div class="photos" id="photos"></div>
        <input type="file" id="file" accept="image/*" multiple hidden>
      </fieldset>

      <label class="f" style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="nick" placeholder="닉네임 (비워두면 익명)" maxlength="12" style="max-width:220px">
      </label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit" id="submit">후기 등록하기</button>
    </form>

    <section>
      <h2>등록된 후기</h2>
      <p class="sync" id="sync" role="status"></p>
      <div class="summary" id="summary"></div>
      <div class="list" id="list"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var CATS = ["홀 분위기", "식사", "주차·교통", "직원 응대", "가성비"];
  var TAGS = ["주차 편함", "주차 불편", "역에서 가까움", "뷔페 맛있음", "식사 아쉬움", "대기 시간 길었음", "추가 비용 있음", "상담 친절", "신부대기실 좋음", "폐백실 넓음", "포토부스 있음", "하객 동선 좋음"];
  var MAXPH = 4;
  var ratings = {}, photos = [], reviews = [];
  var db = null, me = null, isOwner = false, canWrite = null, loaded = false, busy = false;
  var $ = function (id) { return document.getElementById(id); };

  function avg(a) { return a.reduce(function (s, v) { return s + v; }, 0) / a.length; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function starsText(n) { var r = Math.round(n); return "★★★★★".slice(0, r) + "☆☆☆☆☆".slice(0, 5 - r); }
  function toast(m) { var t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2800); }
  function fmtDate(ms) { var d = new Date(ms); return d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate(); }

  // ---- 평점 입력 ----
  var rates = $("rates");
  CATS.forEach(function (c, i) {
    var row = document.createElement("div");
    row.className = "rate";
    row.innerHTML = '<span class="n">' + c + '</span><span class="stars" role="radiogroup" aria-label="' + c + ' 평점"></span>';
    var box = row.querySelector(".stars");
    for (var s = 1; s <= 5; s++) {
      (function (s) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = "★"; b.setAttribute("aria-label", c + " " + s + "점");
        b.onclick = function () { ratings[i] = s; paint(); };
        box.appendChild(b);
      })(s);
    }
    rates.appendChild(row);
  });
  function paint() {
    Array.prototype.forEach.call(rates.children, function (row, i) {
      Array.prototype.forEach.call(row.querySelectorAll("button"), function (b, k) { b.classList.toggle("on", k < (ratings[i] || 0)); });
    });
  }
  $("chips").innerHTML = TAGS.map(function (t) { return '<label><input type="checkbox" value="' + t + '"><span>' + t + '</span></label>'; }).join("");
  $("body").addEventListener("input", function () { $("cnt").textContent = this.value.length; });

  // ---- 사진 (후기 문서에 함께 저장하므로 작게 줄임) ----
  function drawPhotos() {
    var h = photos.map(function (p, i) { return '<div class="ph" style="background-image:url(' + p + ')"><button type="button" data-i="' + i + '" aria-label="사진 삭제">×</button></div>'; }).join("");
    if (photos.length < MAXPH) h += '<button type="button" class="add" id="addph">+ 사진<br>추가</button>';
    $("photos").innerHTML = h;
  }
  $("photos").addEventListener("click", function (e) {
    if (e.target.id === "addph") $("file").click();
    if (e.target.dataset && e.target.dataset.i) { photos.splice(+e.target.dataset.i, 1); drawPhotos(); }
  });
  function shrink(file, cb) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 520 / Math.max(img.width, img.height));
        var c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = function () { toast("이미지를 불러오지 못했어요"); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  $("file").addEventListener("change", function () {
    var fs = Array.prototype.slice.call(this.files, 0, MAXPH - photos.length);
    fs.forEach(function (f) { shrink(f, function (d) { if (photos.length < MAXPH) { photos.push(d); drawPhotos(); } }); });
    this.value = "";
  });
  drawPhotos();

  // ---- 저장소: db 가능하면 공유 저장, 아니면 이 브라우저에만 ----
  var LKEY = "wedding-reviews-local-v2";
  function lload() { try { return JSON.parse(localStorage.getItem(LKEY)) || []; } catch (e) { return []; } }
  function lsave() { try { localStorage.setItem(LKEY, JSON.stringify(reviews)); } catch (e) {} }

  function setSync(t) { $("sync").textContent = t; }
  function updateForm() {
    var off = canWrite === false;
    $("submit").disabled = off || busy;
    if (off) $("err").textContent = "이 페이지는 보기 전용으로 열려 있어 후기를 등록할 수 없어요. 작성하려면 페이지 소유자에게 편집 권한을 요청하세요.";
  }

  function addReview(r) {
    if (!db) { reviews.unshift(r); lsave(); render(); return Promise.resolve(); }
    var data = JSON.parse(JSON.stringify(r)); delete data.id;
    return db.collection("reviews").doc(r.id).set(data);
  }
  function delReview(id) {
    if (!db) { reviews = reviews.filter(function (r) { return r.id !== id; }); lsave(); render(); return Promise.resolve(); }
    return db.collection("reviews").doc(id).delete();
  }

  function subscribe() {
    var timer = setTimeout(function () { if (!loaded) setSync("아직 저장소에 연결되지 않았어요. 잠시 후 다시 확인해주세요."); }, 10000);
    db.collection("reviews").orderBy("at", "desc").limit(300).onSnapshot(function (snap) {
      reviews = snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; });
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); setSync("모든 방문자와 실시간으로 공유됩니다."); }
      render();
    }, function (e) { clearTimeout(timer); loaded = true; setSync(e.code === "revoked" ? "이 페이지에 대한 접근 권한이 변경되었어요." : "후기를 불러오지 못했어요. 새로고침 후 다시 시도해주세요."); render(); });
  }

  // ---- 등록 ----
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    var err = $("err"); err.textContent = "";
    var hall = $("hall").value.trim(), title = $("title").value.trim(), body = $("body").value.trim();
    if (!hall) { err.textContent = "예식장 이름을 입력해주세요."; $("hall").focus(); return; }
    for (var i = 0; i < CATS.length; i++) if (!ratings[i]) { err.textContent = "'" + CATS[i] + "' 평점을 선택해주세요."; return; }
    if (!title) { err.textContent = "한 줄 제목을 입력해주세요."; $("title").focus(); return; }
    if (body.length < 20) { err.textContent = "후기는 20자 이상 적어주세요. 현재 " + body.length + "자입니다."; $("body").focus(); return; }
    var tags = Array.prototype.map.call(document.querySelectorAll("#chips input:checked"), function (c) { return c.value; });
    var r = {
      id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), hall: hall, region: $("region").value, visit: $("visit").value, kind: $("kind").value,
      meal: $("meal").value === "" ? null : +$("meal").value, title: title, body: body,
      scores: CATS.map(function (_, i) { return ratings[i]; }), tags: tags, photos: photos.slice(),
      nick: $("nick").value.trim() || "익명", author: me, at: Date.now()
    };
    busy = true; updateForm();
    addReview(r).then(function () {
      $("form").reset(); ratings = {}; photos = []; paint(); drawPhotos(); $("cnt").textContent = "0";
      toast("후기가 등록되었어요");
      $("list").scrollIntoView({ behavior: "smooth", block: "start" });
    }).catch(function (x) {
      var c = x && x.code;
      err.textContent = c === "quota_exceeded" ? "저장 공간이 가득 차서 등록할 수 없어요. 사진을 줄이거나 오래된 후기를 삭제해주세요."
        : c === "invalid_argument" ? "이 페이지에 쓸 수 있는 권한이 없어요. 소유자에게 편집 권한을 요청하세요."
        : "등록하지 못했어요. 잠시 후 다시 시도해주세요.";
    }).then(function () { busy = false; updateForm(); });
  });

  // ---- 목록 ----
  function render() {
    var n = reviews.length;
    if (!n) {
      $("summary").hidden = true;
      $("list").innerHTML = '<div class="empty">' + (loaded || !db ? "아직 등록된 후기가 없어요.<br>왼쪽 양식에서 첫 후기를 남겨보세요." : "후기를 불러오는 중...") + '</div>';
      return;
    }
    $("summary").hidden = false;
    var all = reviews.map(function (r) { return avg(r.scores); });
    var meals = reviews.filter(function (r) { return r.meal != null; }).map(function (r) { return r.meal; });
    $("summary").innerHTML =
      '<div class="big">' + avg(all).toFixed(1) + '</div>' +
      '<div><div style="color:var(--star)">' + starsText(avg(all)) + '</div><small>후기 ' + n + '개 평균</small></div>' +
      (meals.length ? '<div><b style="font-variant-numeric:tabular-nums">' + avg(meals).toFixed(1) + '만원</b><small>평균 식대(1인)</small></div>' : "");
    $("list").innerHTML = reviews.map(function (r) {
      var a = avg(r.scores);
      var meta = [r.region, r.visit && r.visit.replace("-", "년 ") + "월", r.kind, r.meal != null ? "식대 " + r.meal + "만원" : ""].filter(Boolean).map(esc).join(" · ");
      var mine = isOwner || (me && r.author === me) || !db;
      return '<article class="card">' +
        '<h3>' + esc(r.hall) + '</h3><div class="meta">' + meta + '</div>' +
        '<div class="overall" aria-label="평균 ' + a.toFixed(1) + '점">' + starsText(a) + '<b>' + a.toFixed(1) + '</b></div>' +
        '<div style="font-weight:700">' + esc(r.title) + '</div>' +
        '<p class="body">' + esc(r.body) + '</p>' +
        '<div class="scores">' + r.scores.map(function (s, i) { return "<span>" + CATS[i] + " " + s + "</span>"; }).join("") + '</div>' +
        (r.tags && r.tags.length ? '<div>' + r.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("") + '</div>' : "") +
        (r.photos && r.photos.length ? '<div class="thumbs">' + r.photos.map(function (p) { return '<img alt="후기 사진" src="' + esc(p) + '">'; }).join("") + '</div>' : "") +
        '<div class="foot"><span>' + esc(r.nick || "익명") + ' · ' + fmtDate(r.at) + '</span>' + (mine ? '<button type="button" data-del="' + esc(r.id) + '">삭제</button>' : "") + '</div>' +
        '</article>';
    }).join("");
  }
  $("list").addEventListener("click", function (e) {
    var id = e.target.dataset && e.target.dataset.del;
    if (!id) return;
    if (e.target.dataset.sure !== "1") { e.target.dataset.sure = "1"; e.target.textContent = "정말 삭제할까요?"; return; }
    delReview(id).catch(function () { toast("삭제하지 못했어요"); });
  });

  // ---- 시작 ----
  render();
  setSync("연결 중...");
  var claude = window.claude;
  var ready = claude && claude.use ? Promise.all([claude.use("db"), claude.use("user")]) : Promise.resolve([null, null]);
  ready.then(function (res) {
    db = res[0]; var user = res[1];
    if (!user) return;
    return Promise.all([user.id(), user.isOwner(), user.can("data.write")]).then(function (v) { me = v[0]; isOwner = v[1]; canWrite = v[2]; });
  }).catch(function () {}).then(function () {
    if (db) { updateForm(); subscribe(); }
    else { reviews = lload(); setSync("공유 저장소에 연결할 수 없어 이 브라우저에만 저장됩니다."); render(); }
  });
})();
</script>

</body>
</html>
